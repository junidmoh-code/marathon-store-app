name: Card recon tests

# The card-recon PDF path and the mailbox poller's decisions. The real-report
# corpus (functions/test/card-recon-corpus.test.cjs) is NOT in git — the files
# print card numbers and this repo is public — so here it skips by name; it
# runs on the Mac mini, where the reports live.
#
# Tests only. This workflow must never gain a deploy step — functions are
# shared with marathon-pos-app and are deployed BY NAME, by hand; rules are
# never deployed from CI. See DEPLOY-TRACKER.md.
# TILL 2 GUARDS (Junid, 27 Nov 2026 — "Till 2 must never break again"): this
# runs on EVERY pull request (no path filter), so no change anywhere can merge
# past test/card-recon-till2-guard.test.cjs or the Card Slip screen's tests.
# Junid's rule – do not weaken or delete without his written instruction.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  card-recon:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Any test that reaches for the database emulator gets a dead port, not
      # the live project.
      FIREBASE_DATABASE_EMULATOR_HOST: 127.0.0.1:9
    steps:
      - uses: actions/checkout@v4
        with:
          # Tests only, never a push: keep the token out of .git/config while
          # npm runs third-party install scripts. (CodeRabbit, PR #726.)
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: functions
      - name: PDF path, real-report corpus, capture pipeline
        working-directory: functions
        run: >-
          node --test
          test/card-recon-corpus.test.cjs
          test/card-recon-*.test.cjs
          test/pdf-*.test.cjs
          test/card-batch-supersede.test.cjs
          test/card-expected.test.cjs
      - name: Till 2 guards (Junid's rule — photo always accepted, bottom total only, never stuck)
        working-directory: functions
        run: node --test test/card-recon-till2-guard.test.cjs test/card-sb-faded-tid.test.cjs test/card-slip-concrete.test.cjs test/card-sb-typed-stands.test.cjs
      - run: npm ci
        working-directory: scripts/cardrecon
      - name: Mailbox poller decisions
        working-directory: scripts/cardrecon
        run: npx vitest run

  # The Card Slip screen (store app): a photo is always sendable.
  card-slip-screen:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # The screen's tests reason in the shops' own time (SAST): under UTC,
    # slipTerminals.test.jsx fails after 18:00 UTC (pre-existing on main).
    env:
      TZ: Africa/Johannesburg
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Card Slip screen tests
        run: npx vitest run src/components/cardrecon
