<!doctype html>
<html lang="en" data-sky="on">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="64x64" href="/icons/favicon-64-sky.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1d9bfb" />
    <!-- Sky DNA typography (src/styles/sky.css). Same loading path as the TV board's Archivo. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400..900;1,14..32,700..900&display=swap" rel="stylesheet" />
    <!-- The room is preloaded so the first paint is the photo, never black. -->
    <link rel="preload" as="image" href="/assets/sky-clear.jpg" media="(min-width: 768px) and (orientation: landscape), (min-width: 1024px)" />
    <link rel="preload" as="image" href="/assets/sky-clear-phone.jpg" media="(max-width: 767px), (orientation: portrait) and (max-width: 1023px)" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />

    <!-- iOS standalone behaviour -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Marathon" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180-apple-sky.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192-sky.png" />

    <title>Marathon Store — Order Management</title>
  </head>
  <body style="margin:0;background:#1d9bfb;">
    <!-- THE ROOM (design/DNA.md): the photo, untouched, fixed behind everything at
         z-index 0. Never background-attachment:fixed (iPad Safari ignores it). -->
    <div class="sky-bg" aria-hidden="true"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
