<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Fontconfig for the social design layer.

  sharp renders the overlay SVG through librsvg, which resolves font families
  through fontconfig. Cloud Functions runs a minimal Linux image with almost no
  fonts installed and NO Helvetica or Arial, so a family named in the SVG that
  is not present here does not fail — it silently falls back to whatever
  fontconfig has, and every post quietly comes out in a different typeface.
  That is the failure this file exists to prevent.

  FONTCONFIG_PATH is pointed at this directory by social-design.cjs at load
  time; fontconfig then reads this file and finds Archivo beside it.
-->
<fontconfig>
  <dir prefix="default">.</dir>
  <dir>/usr/share/fonts</dir>
  <cachedir prefix="default">.fontcache</cachedir>
  <cachedir>/tmp/.fontcache</cachedir>

  <!-- Anything the SVG asks for that we do not ship resolves to Archivo,
       rather than to an arbitrary survivor of the base image. -->
  <alias><family>sans-serif</family><prefer><family>Archivo</family></prefer></alias>
  <alias><family>Helvetica</family><prefer><family>Archivo</family></prefer></alias>
  <alias><family>Helvetica Neue</family><prefer><family>Archivo</family></prefer></alias>
  <alias><family>Arial</family><prefer><family>Archivo</family></prefer></alias>
</fontconfig>
